name: SimpleCaffeine
options:
  bundleIdPrefix: io.github.akshatbaranwal
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: io.github.akshatbaranwal.simple-caffeine
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SimpleCaffeine:
    type: application
    platform: macOS
    sources:
      - SimpleCaffeine
    settings:
      base:
        PRODUCT_NAME: SimpleCaffeine
        INFOPLIST_FILE: SimpleCaffeine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
